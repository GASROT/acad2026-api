services:
  - type: web
    name: academia-api
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm run migrate && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 24.14.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: academia-db
          property: connectionString

databases:
  - name: academia-db
    plan: free
    databaseName: academia
    user: academia
    ipAllowList: []
